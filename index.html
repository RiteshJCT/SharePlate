<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharePlate</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8f6;
      color: #172019;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 7%;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
    }

    .logo span {
      color: #35a853;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    .hero-content {
      max-width: 800px;
    }

    h1 {
      font-size: clamp(48px, 8vw, 86px);
      line-height: 0.95;
      margin: 0 0 25px;
      letter-spacing: -4px;
    }

    h1 span {
      color: #35a853;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
      color: #667067;
      max-width: 650px;
      margin: 0 auto 35px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      background: #35a853;
      color: white;
    }

    .secondary {
      background: white;
      color: #172019;
      border: 1px solid #dfe4df;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 70px;
      padding: 50px 20px;
      border-top: 1px solid #e3e7e3;
    }

    .stat {
      text-align: center;
    }

    .number {
      font-size: 32px;
      font-weight: 700;
    }

    .label {
      color: #737c74;
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      .stats {
        gap: 25px;
      }

      .number {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">Share<span>Plate</span></div>
  </nav>

  <main class="hero">
    <div class="hero-content">

      <h1>
        Turn surplus<br>
        into <span>impact.</span>
      </h1>

      <p>
        SharePlate connects surplus food with organizations
        that can put it to use — before it goes to waste.
      </p>

      <div class="buttons">
        <button class="primary" onclick="alert('Donation system coming next!')">
          Donate Food
        </button>

        <button class="secondary" onclick="alert('Food finder coming next!')">
          Find Food
        </button>
      </div>

    </div>
  </main>

  <section class="stats">

    <div class="stat">
      <div class="number">0</div>
      <div class="label">Meals Rescued</div>
    </div>

    <div class="stat">
      <div class="number">0 lb</div>
      <div class="label">Food Saved</div>
    </div>

    <div class="stat">
      <div class="number">0</div>
      <div class="label">Successful Matches</div>
    </div>

  </section>

</body>
</html>
